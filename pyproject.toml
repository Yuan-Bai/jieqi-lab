# Tooling configuration for the source tree.
#
# The project is currently run in place (`python web_server.py`,
# `python gui.py`, `python azero.py`).  Packaging metadata and a build
# backend will be added together with the src/ package-layout migration,
# so this file intentionally has no [build-system] or [project] table yet.

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "data",
]
